acceptance_criteria:
  - "A runnable Expo Web application exists under personal-co with Chat, Core Memory, Archive, Import, and Settings surfaces."
  - "The application finds or creates exactly one Letta agent by the personal-co-v1 tag, uses a configurable Letta base URL/model/embedding handle, disables sleeptime, and exposes no automatic cross-provider fallback."
  - "Agent initialization uses exactly four writable user memory blocks (PROFILE, CURRENT_CONTEXT, GOALS_AND_DECISIONS, LEARNING_MODEL) plus PERSONA and MEMORY_POLICY policy blocks; dynamic memory categories are not created."
  - "The system prompt distinguishes confirmed, observed, inferred, hypothesis, and superseded states; defaults uncertain information to archive; protects stable profile/goal updates; and requires confirmation before external writes."
  - "External imports default to external_import archive candidates and do not mutate PROFILE or GOALS_AND_DECISIONS without explicit confirmation."
  - "Learning state logic prevents a read-only exposure from becoming usable without application or transfer evidence."
  - "No API keys or generated secrets are committed; settings and .env.example contain placeholders only."
  - "Targeted domain tests, TypeScript checking, Expo Web export, protocol validation, and git diff checks pass."
  - "The implementation is original and records letta-ai/co as an architectural reference without copying its unlicensed source."

validation_commands:
  - "cd personal-co && npm test"
  - "cd personal-co && npm run typecheck"
  - "cd personal-co && npm run export:web"
  - "python3 -B scripts/validate_protocol.py"
  - "python3 -B scripts/protocol_gate.py audit"
  - "git diff --check"
  - "git status --short --untracked-files=all"

