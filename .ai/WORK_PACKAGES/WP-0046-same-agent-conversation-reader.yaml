human_approval_required: false
approval_note: "Standing authorization covers this necessary identity/data-read adapter and narrow transport message-ID compatibility change. Native capability/Agent identity supplied by trusted host, never browser/model input. No auth relaxation or new command privileges."
acceptance_criteria:
  - "AC1: Import-safe createConversationReader(client,{agentId}) wraps an existing authenticated client, exact immutable trusted Agent binding, no raw client/capability returned. Public operations listConversations({search?,cursor?},{signal?}), listMessages(conversationId,{cursor?},{signal?}), close(). Strict bounded data inputs and static sanitized failures; no commands beyond current six read RPCs, no implicit Agent creation or writes."
  - "AC2: Each read validates unique personal-co-v1 tagged Agent using bounded tag-filtered inventory and exact expected ID; zero/duplicate/wrong/missing-tag/malformed Agent fails closed. Every list row, retrieved conversation and message carries exact expected agent_id; messages also exact conversation_id. Before message read validate named conversation ownership/non-hidden status. Revalidate identity and conversation after asynchronous content fetch before returning; no cross-Agent partial results."
  - "AC3: Return minimal immutable display DTOs only: conversation id/summary/tags/timestamps and message id/role/content/date, with bounded supported fields. Only user_message and assistant_message text content displayed; omit reasoning, tool/system/approval/summary messages and unknown fields, and never return image/base64/tools/secrets/config. Keep text as untrusted text, not HTML/instructions. Unsupported visible attachments are honestly indicated, not silently called a complete transcript. This does not promise temporary-privacy filtering; future trusted broker must apply product privacy gates."
  - "AC4: Fixed bounded page sizes, native descending order, issued opaque cursors bound to reader/kind/search/conversation, no raw client-supplied native cursors. Detect repeated/duplicate/nonadvancing pages and malformed pagination; preserve continuation even when visible page is empty because native page contains only internal messages. Bound cursor retention and total scanned rows; fail explicitly at bound, no automatic scanning/polling/retries. close invalidates cursors/in-flight result delivery without claiming ownership of borrowed client. Abort honored; caller mutation after async dispatch cannot change request authority."
  - "AC5: Reproduce current transport rejection of native colon-containing projected message IDs before fixing. Permit bounded native message IDs/cursors separately from strict Agent/conversation IDs; no broad relaxation of entity IDs/endpoints/commands. Regression covers assistant/reasoning/tool projected IDs, hostile IDs and input/query differentiation. Controlled reader tests include real ws server through createAuthenticatedAppServer (synthetic test sandbox seam only), two conversations, Chinese visible content, non-text/internal canaries, pagination and identity races. No actual upstream launch/install/provider calls."
  - "AC6: Focused reader and transport tests, related domain identity tests/typecheck pass; independent review maps all criteria including security/data scope. Memory accurately records host library only and next browser/lifecycle/creation/classification/live integration work, not a usable deployed S2 or complete assistant."
