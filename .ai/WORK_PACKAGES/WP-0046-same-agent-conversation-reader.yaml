repair_scope: "Independent AC4 FAIL: hidden issued anchor plus21 unseen new rows causes undetected native pagination reset. Fix only reader/tests with one-row overlap verification for both list and history: retain prior page penultimate raw/displayed ID as native boundary and final ID as expected overlap. Resume after/before penultimate with bounded extra row; require first returned raw row exactly prior final ID before dropping overlap and processing continuation. This directly proves continuity despite native missing-cursor fallback, using existing commands/no extra RPC. Preserve lookahead and native next_before semantics, validate overlap ownership, reject stale/hidden/search-removed anchor without consuming opaque cursor. Cover missing anchors and normal continuations for both methods. One product fix after master metadata fix1; no transport/HTTP/runtime changes."
