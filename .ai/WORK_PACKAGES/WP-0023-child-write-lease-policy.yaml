acceptance_criteria:
  - "Child implementer policy requires an explicit write lease before any child can edit parent-reserved files."
  - "The parent implementer must pause writes to leased files until the child report is reviewed and the lease is returned or revoked."
  - "Context packet, pre-spawn checklist, routing matrix, implementer role instructions, metrics, and TEST_MATRIX consistently describe write lease fields and conflict checks."
  - "Validator coverage detects missing child write-lease policy markers."
  - "No dependencies, deletions, public APIs, production config, auth/payment/permissions/secrets handling changes, broad refactors, or recursion-depth expansion are introduced."

validation_commands:
  - "python3 -B -m unittest tests/test_validate_protocol.py"
  - "python3 -B scripts/validate_protocol.py"
  - "python3 -B scripts/protocol_gate.py audit"
  - "git diff --check"
  - "git status --short --untracked-files=all"

