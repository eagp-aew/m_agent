task_id: WP-0023-child-write-lease-policy
status: ACCEPTED
objective: "Define and validate child implementer write-lease handoff semantics so parent and child implementers cannot concurrently edit the same reserved files."
why: "Post-WP-0022 rescan found that child implementers may edit exact subsets of parent reservations, but the protocol lacks a required parent pause or write-lease ownership handoff. That leaves conflict prevention dependent on convention."
scope_type: protocol
priority: P0

provenance:
  created_at: "2026-05-07"
  created_by: codex-master
  source:
    - "Post-WP-0022 rescan."
    - "Explorer finding: child implementer write concurrency lacks an explicit lease/suspension model."
  trust_level: repo_controlled
  verified_by: ".ai/AGENT_REPORTS/WP-0023-verifier.md"
  superseded_by: null

risk_class: protocol_validation

context_profile: protocol
context_profile_reason: "The work touches recursive delegation policy, context packet fields, role instructions, metrics, validator checks, tests, and durable memory."

fallback_verification:
  allowed: false
  reason: "Recursive write-safety protocol changes should receive independent verifier evidence."
  high_risk_requires_independent_verifier: true
  allowed_evidence_type: VERIFIER_REPORT

execution_budget:
  max_steps: 14
  max_tool_calls: 100
  deadline: null
  trace_path: ".ai/AGENT_REPORTS/WP-0023-verifier.md"
