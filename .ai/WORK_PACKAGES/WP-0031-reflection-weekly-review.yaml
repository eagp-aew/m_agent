acceptance_criteria:
  - "Cross-domain connection records accept only analogy, prerequisite, causal, contradiction, or transfer; require two distinct domains or concepts, a shared mechanism, an important difference or boundary, and a concrete future-learning value; deduplicate records and retain at most one to three per review."
  - "Growth hypotheses are human-inspectable and falsifiable: each requires a statement, inferred or hypothesis status, numeric confidence from 0 through 1, nonblank dated or attributable evidence, at least one alternative explanation, a falsifier, and an explicit boolean user-confirmed state. They remain Archive evidence and never become stable personality labels automatically."
  - "A weekly review is created only by an explicit user action and always renders the five ordered sections: this week's progress, learning-state changes, unfinished threads, possible patterns, and exactly one next-week focus. No timer, background Agent, automatic trigger, or scheduling dependency is introduced."
  - "The weekly-review serializer produces one quoted, human-inspectable Archive episode with normalized type/source/epistemic/date/provenance tags, structured connections and hypotheses, no executable instructions, no credentials, and no hidden core promotion."
  - "Optional assistant drafting uses the same exact connected Agent, requests no memory writes, reconciles attempted Block/Archive mutations, requires the exact five headings, and displays coaching separately from user-reviewed evidence."
  - "Completing a review revalidates the exact Agent inside one callback-scoped persistent workflow, writes Archive before producing any core proposal, and reports completion only after a new Archive ID with exact text, tag set, and timestamp is read back while the Agent binding is unchanged. No Block is written during this workflow."
  - "Validated cross-domain connections produce at most one pending LEARNING_MODEL proposal that preserves unrelated content, records relationship/mechanism/difference/future value, respects the exact Block limit, and can be applied only through the existing Memory Changes confirmation surface."
  - "Review-suggested changes for any of the four writable user Blocks are batched at the end as exact-Agent-bound pending proposals. Apply rechecks the current Block identity and base value so stale proposals cancel instead of overwriting newer memory; each proposal can be applied or cancelled independently."
  - "Blank, malformed, duplicate, credential-shaped, over-limit, disconnected, changed-Agent, reconciliation-failed, Archive-failed, stale-readback, or stale-proposal cases never report success or write core memory; partial and unverified outcomes disclose retained Archive evidence precisely."
  - "Deterministic tests cover connection types/bounds/deduplication, falsifiable hypotheses, five-section ordering, serialization/tags, no-write drafting, exact-Agent Archive-first persistence and exact new-record verification, pending all-core proposals, LEARNING_MODEL preservation/limit checks, stale proposal rejection, and honest failures. Full tests, typecheck, Web export, responsive browser QA, protocol validation, and independent verification pass."
  - "No dependency, public API, auth, secret, environment, migration, production configuration, database operation, Agent lifecycle, model/embedding, external-service, background-scheduling, automatic-fallback, broad-refactor, or deletion change occurs."

