acceptance_criteria:
  - "A pure guided-learning contract represents the six documented stages—input, diagnosis, explanation, verification, memory, and review—and supplies one to three diagnostic questions plus a verification request based on explain, compare, apply, or counterexample rather than treating exposure as mastery."
  - "Learning-state transitions remain exactly exposed, developing, usable, and needs_review: read-only exposure cannot exceed exposed, practice cannot exceed developing, only application or transfer evidence can support usable, and contradiction evidence produces needs_review. Blank or unknown evidence fails closed."
  - "A completed episode requires a nonblank topic, source, learning goal, diagnostic response, explanation, verification evidence, and evidence detail; it normalizes date/provenance, records misconceptions when present, and accepts at most three nonblank deduplicated high-value retrieval questions."
  - "The episode serializer produces a human-inspectable learning_episode Archive record with normalized type/source/epistemic/date/provenance tags and no executable instructions, credentials, or hidden automatic promotion."
  - "The LEARNING_MODEL updater keeps one current entry per normalized concept, records state, evidence, misconception, and next retrieval question, preserves unrelated content, refuses an unsupported promotion, and fails before writing when the resulting text exceeds the exact Block limit."
  - "A responsive Learning surface lets the user enter the episode evidence, request diagnostic/explanation/verification coaching through the same connected Agent, preview the derived state before saving, and clearly distinguishes assistant coaching from evidence that actually supports memory."
  - "Coaching turns request no memory writes and reconcile any attempted Block/Archive mutation. Completing an episode revalidates the exact connected Agent inside one callback-scoped persistent workflow, archives evidence before updating LEARNING_MODEL, refreshes memory, and records each applied or failed mutation honestly."
  - "Invalid/incomplete episodes, disconnected or changed-Agent contexts, model-switch barriers, reconciliation failures, Archive failures, unsupported state claims, and Block-limit failures never report success or silently advance learning state; if Archive succeeds but the Block update fails, the retained evidence and partial result are explicit."
  - "Deterministic tests cover all state gates, stage ordering, question bounds/deduplication, serialization/tags, one-entry-per-concept updates, Block-limit rejection, no-write coaching intent, exact-Agent completion, Archive-before-Block ordering, and partial failure. Full tests, typecheck, Web export, narrow/desktop browser QA, protocol validation, and independent verification pass."
  - "No dependency, public API, auth, secret, environment, migration, production configuration, database operation, Agent lifecycle, model/embedding, external-service, file-upload, automatic fallback, broad-refactor, or deletion change occurs."

