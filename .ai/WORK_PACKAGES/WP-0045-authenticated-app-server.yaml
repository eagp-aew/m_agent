  - node --test personal-co/tests/runtime-sandbox.test.mjs tests/test_runtime_confinement_probe.mjs
  - cd personal-co && npm run typecheck
  - "After independent security PASS only: opt-in fixed native test; exact invocation/freeze in runtime report."
  - git diff --check
  - python3 -B scripts/validate_protocol.py
dependency_policy: "Initial Expo install dry-run proposed removal of optional packages; stopped before edits/install. Use new isolated personal-co/server/package.json/private Node host package with exact ws8.21.3 and server/package-lock.json; npm --prefix personal-co/server install --ignore-scripts --no-audit --no-fund --omit=optional into fresh server/node_modules only, with no existing tree to prune. Existing Expo/runtime manifests and node_modules untouched. Test may resolve ws using createRequire anchored to server/package.json. No custom network proxy or lifecycle scripts; stop if actual unrelated removals are proposed."
rollback_plan: "No production switch; close only test-owned sockets/processes, retain synthetic artifacts. Preserve old runtime install and unrelated files."
