approval_note: "Standing user authorization covers this necessary host authentication module and explicit ws8.21.3 direct dependency. Raw new ephemeral capability may be used only for this runtime connection; never expose real account credentials. No new service or paid calls."
human_approval_required: false
acceptance_criteria:
  - "AC1: Server-only import-safe factory composes unchanged validated WP0044 launch spec with native --ws-auth capability-token --ws-token-sha256 flags. Generate cryptographically random >=256-bit ephemeral capability after path validation, keep raw token private to closure; returned enumerable objects/JSON/argv/env/errors never expose it. Fresh factories differ. Dispose prevents new connections and closes owned sockets; no disk/env/browser credential storage or false secure-erasure claim."
  - "AC2: Connect via explicitly declared exact ws8.21.3, Authorization Bearer header only. Literal ws://127.0.0.1:port/ws endpoint only; no query/userinfo/fragment/aliases/redirects/proxies/custom client-provided headers, no TLS bypass. Fixed handshake timeout/message/fragment limits, compression off. Native HTTP401/403 and other errors sanitized; do not echo upstream bodies, headers, URLs, close reasons or token."
  - "AC3: Reusable read-only host RPC request surface supports exact app_server_info, agent_list, agent_retrieve, conversation_list, conversation_retrieve, conversation_messages_list shapes from pinned protocol, with bounded limits/cursors/IDs and no files/tools/runtime_start/input/mutations. Correlate own request_id/type, reject malformed responses, cap pending/request bytes and unsolicited events, no automatic retries or reconnect. Return server data as untrusted data, not authorization. Initial info validates pinned version/local backend/protocol before exposing ready client."
  - "AC4: Controlled tests exercise header-only secrecy, auth errors/redirects, endpoint rejection before socket creation, malformed/mismatched/oversized/late/unsolicited messages, timeout/disconnect/abort/send failure, overlapping requests and disposal cleanup. Defaults cannot launch upstream runtime. Any trusted test seams clearly separate from public/model inputs. Existing sandbox/confinement21 tests and typecheck pass; lock changes limited to exact direct ws and required dependency placement, no unrelated upgrades."
  - "AC5: After independent frozen-source security PASS only, opt-in test creates fresh private /private/tmp state/protected roots, reuses pinned dependency root, uses existing startOwned test helper for bounded native process. Missing and wrong bearer get actual401; correct private factory connection returns pinned info and empty Agent list. No Agent creation/memory/provider/turn calls. Always close sockets/process group/listener and retain synthetic roots. Report public hashes/pins/observations/owned PIDs only, no token. Final verifier corroborates actual result/cleanup without replaying passed probe."
  - "AC6: Record actual evidence and current state/queue before acceptance. This is host transport used next by broker, not full UI migration, authentication of browser users, multi-tenant authorization, provider access, erasure/lifecycle recovery or assistant completion. No alternative memory truth/agent introduced."
validation_commands:
