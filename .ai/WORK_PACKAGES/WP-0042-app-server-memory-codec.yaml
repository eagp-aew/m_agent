acceptance_criteria:
  - "AC1: Pure no-dependency module exports explicit schema/version and encode/decode API. Envelope contains Agent ID, nonnegative safe-integer revision, exact six blocks and Archive. Decode requires exact expected Agent ID, rejects unknown version/schema and malformed envelope; no import-time I/O."
  - "AC2: Reuse fixed labels/read-only policy. Require unique nonblank block IDs, exact string values and valid optional limit, correct four-writable/two-read-only flags; accept existing readOnly/read_only representation but reject conflicting aliases. Preserve IDs, values, limits including null, metadata including null and all valid JSON extension fields exactly; no silent coercion/filtering/trimming or policy changes."
  - "AC3: Archive requires unique nonblank IDs, string text and string-array tags; preserve exact tag ordering/duplicates, timestamps and JSON extension/provenance fields. Optional createdAt/updatedAt timestamps, when present, must be valid strings (do not rewrite offsets/text) or null. Empty Archive valid. No dedupe, synthesis, sorting or delete/write operations."
  - "AC4: Reject unsupported/lossy JSON values (undefined, non-finite numbers, bigint, functions, symbols, sparse arrays, cycles, nonplain/accessor objects) rather than dropping/coercing. Strict data parser returns an independent deep-frozen representation; errors disclose no source content. No claimed secret stripping: this is internal data format, not share/export format."
  - "AC5: Tests exercise unicode/newlines/nested metadata, both readonly aliases/conflicts, wrong Agent/schema/version, missing/extra/duplicate labels/IDs, malformed values/limits/tags/timestamps, unsupported JSON, caller mutation and exact Archive ordering. Related memory/snapshot tests and typecheck pass or concrete issues explained."
  - "AC6: Scope remains codec only; do not claim OS/server read-only enforcement, successful migration, search/delivery/atomic persistence or erasure. Independent verifier evidence and current factual state/queue updates required before acceptance; final accepted-history/DONE after verdict."
design_boundary: "Canonical format is a candidate single authoritative record inside the same Letta Agent's memory namespace, not a second persona database. No path/write mechanism/projection is enabled here. Protected writer/tool confinement, atomicity/CAS, runtime injection, lossless source-Agent migration and historical-retention policy are separate unresolved integration requirements."
