acceptance_criteria:
  - "AC1: Host-only no-dependency open/read/initialize/commit/close API, no import-time I/O. Caller-provided existing private owned canonical real directory, exact Agent ID, fixed filenames never derived from Agent data. Reject unsafe directories/symlinks/nonregular data/lock targets, wrong Agent/corrupt data. Missing store requires explicit revision0 initialization that cannot overwrite an existing record; never auto-reinitialize corruption."
  - "AC2: Exclusive lifetime lock via exclusive creation; second cooperating owner fails closed including separate process. Never automatically steal stale lock. Serialize same-instance operations; close releases only owned lock, closed instance rejects operations. Lock interference fails closed. Cooperative protection, not OS sandbox against same-user arbitrary code."
  - "AC3: Codec read gives exact independent frozen data. Commit validates expected safe revision, Agent/schema and next revision increment before mutation. Preserve block IDs/labels/limits/flags/extensions, both policy blocks entirely. Only writable value/metadata may change; PROFILE/GOALS_AND_DECISIONS changes require confirmedLabels for this exact commit/revision. Archive/root extension changes are trusted-host operations, not model authorization."
  - "AC4: Exclusive0600 same-directory temporary file, fully written/fsynced before atomic publication, directory synced before success. Initialize uses no-clobber fs.link then owned temp unlink; commit uses atomic rename. Conflict/validation/pre-publication failure leaves old bytes untouched. Uncertain publication or post-publication error poisons writer and returns distinct unknown-outcome error; require read/reopen reconciliation, never blind replay. Retained owned temp aliases must be recorded as privacy/lifecycle risk. Do not claim power-loss proof beyond tested ordering."
  - "AC5: Real-filesystem tests cover init/read/update/reopen, exact Blocks/Archive, same/separate-process contention, concurrent stale commits, readonly/stable confirmation/identity protection, unsafe paths/lock interference/corruption and deterministic pre/post-replacement I/O failures. Newly allocated synthetic directories retained; only own lock/temp files may be unlinked one exact owned path at a time, never recursive/batch deletion. Related codec/domain/governance tests/typecheck pass."
  - "AC6: Independent data-integrity/security verification and factual state/queue before acceptance. No actual migration, public transport, UI switch, model tool or new Agent. Runtime OS confinement, lifecycle/stale-lock recovery, projection, privacy/backup retention and deployment remain explicit unfinished work."
design_boundary: "Trusted host-only canonical writer for same Agent namespace, not second Agent/persona database. Placement and runtime deny-write enforcement remain integration gates. confirmedLabels is trusted host assertion bound to passed candidate/revision, not authentication or LLM approval. Unix local filesystem initial target, no network FS/external writer guarantees."
