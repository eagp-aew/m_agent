  - "tests/test_validate_protocol.py"

acceptance_criteria:
  - "Metrics explicitly state that 100% work-package coverage applies after enforcement and that historical pre-enforcement exceptions are separately enumerated."
  - "Validator fails accepted non-exception tasks with missing work_package_path."
  - "Validator requires historical exceptions to link to the historical fallback verification report."
  - "Unit tests cover an unregistered missing work_package_path failure and current queue pass."
  - "No dependencies, deletions, public APIs, production config, auth/payment/permissions/secrets handling changes, broad refactors, or historical fact rewrites are introduced."

validation_commands:
  - "python3 -B -m unittest tests/test_validate_protocol.py"
  - "python3 -B scripts/validate_protocol.py"
  - "python3 -B scripts/protocol_gate.py audit"
  - "git diff --check"
  - "git status --short --untracked-files=all"

implementation_shards:
  - shard_id: historical-exception-validator
    objective: "Add metrics documentation and validator/test coverage for historical work-package exceptions."
    worktree: "codex-wp0024-historical-exception-validator"
    allowed_files:
      - ".ai/METRICS.md"
      - ".ai/TEST_MATRIX.md"
      - "scripts/validate_protocol.py"
      - "tests/test_validate_protocol.py"
    blocked_by: []
    validation_commands:
