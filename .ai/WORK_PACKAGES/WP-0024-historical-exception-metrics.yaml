task_id: WP-0024-historical-exception-metrics
status: ACCEPTED
objective: "Make historical work-package exceptions explicit so the 100% work-package-before-implementation metric cannot overclaim."
why: "Post-WP-0023 rescan found historical accepted tasks with `work_package_path: null` while metrics still state a 100% target. These pre-enforcement exceptions need explicit accounting and validation."
scope_type: validation
priority: P0

provenance:
  created_at: "2026-05-07"
  created_by: codex-master
  source:
    - "Post-WP-0023 rescan."
    - "Explorer finding: historical exceptions can make compliance metrics overstate work-package coverage."
  trust_level: repo_controlled
  verified_by: ".ai/AGENT_REPORTS/WP-0024-verifier.md"
  superseded_by: null

risk_class: protocol_validation

context_profile: protocol
context_profile_reason: "The work touches metrics semantics, validator checks, tests, and durable memory."

fallback_verification:
  allowed: true
  reason: "The change is low-risk validation, metrics documentation, tests, and memory-policy hardening."
  high_risk_requires_independent_verifier: false
  allowed_evidence_type: VERIFIER_REPORT

execution_budget:
  max_steps: 10
  max_tool_calls: 80
  deadline: null
  trace_path: ".ai/AGENT_REPORTS/WP-0024-verifier.md"
  cancellation:
    owner: master
    condition: "Stop on dependency changes, deletion, public API changes, production config, secrets, broad refactors, or changes that rewrite historical facts without evidence."

allowed_files:
  - ".ai/METRICS.md"
  - ".ai/TEST_MATRIX.md"
  - "scripts/validate_protocol.py"
  - "tests/test_validate_protocol.py"
  - ".ai/WORK_PACKAGES/WP-0024-historical-exception-metrics.yaml"
  - ".ai/TASK_QUEUE.yaml"
  - ".ai/MASTER_LEDGER.yaml"
