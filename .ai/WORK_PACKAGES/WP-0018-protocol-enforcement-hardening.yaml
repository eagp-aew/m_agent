acceptance_criteria:
  - "A canonical tool policy reference defines command classes, destructive-command handling, network/escalation handling, path boundaries, and report audit expectations."
  - "Context packets include trust-boundary fields so external content, tool output, and memory can be labeled and quarantined instead of treated as instructions."
  - "Subagent reports distinguish command policy classification and evidence paths enough for the validator to audit accepted work."
  - "The protocol validator checks tool-policy presence, trust-boundary field coverage, verification report referenced paths, and lightweight secret patterns."
  - "The test matrix documents the new enforcement checks."
  - "No dependencies, new roles, public APIs, production config, auth/payment/permissions/secrets handling changes, or file deletions are introduced."

validation_commands:
  - "python3 scripts/validate_protocol.py"
  - "python3 -m py_compile scripts/validate_protocol.py"
  - "git diff --check"
  - "git status --short --untracked-files=all"

