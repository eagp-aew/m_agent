    limits: "Canonical existing1MiB bound; preview query<=256chars, at most20 candidates returned with explicit more/omitted indicator; complete candidate inspection bounded by canonical size. Per paragraph<=4096UTF8bytes (overlong omitted, not silently truncated); at most4 selected, total selected text<=8192bytes, final system<=16384bytes. IDs/digests lowercase64hex, revision safe nonnegative integer. No getters/proxies/sparse arrays/extra fields executed or persisted."
