  - "Future send records host-correlated terminal before history proof; missing terminal remains unknown after restart even if messages are visible. Store evidence methods are host-private assertions, never browser/model RPC."
  - "Future display projects original user text only from exact receipt/client OTID/conversation/Agent binding, never generic tag stripping."
  - "Canonical freeform values are not safely auto-current/relevant merely because stored. Finalize explicit relevant-context/supersession admission before forwarding personal data; full snapshot probe is not production policy."
