      - "C2.3: Client/controller create/send/status/pending/create-recovery/context selection work; double-click/late result/switch/edit/response loss/reconnect never lose unsent text or replay uncertain writes. Polling bounded and stopped on terminal/disconnect, no timer-driven resend."
