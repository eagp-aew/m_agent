acceptance_criteria:
  - "AC1: Existing local UI creates a named retained conversation on the same canonical Agent, sends plain text, displays persisted reply, and reopens it after host restart. No fake/demo reply in connected mode."
  - "AC2: Durable host operation identity precedes every create/send side effect; duplicate/concurrent requests and restart never blindly resend an ambiguous operation. Unknown remains distinct from failed/completed; only correlated terminal plus persisted readback proves completion."
  - "AC3: Preserve exact browser authority, bounded owned runtime lifecycle, no model tool execution, six canonical blocks and relevant-context privacy. No private context in user rows or raw authority/error leaks. Provider selection is explicit and no silent fallback."
  - "AC4: UI preserves unsent/uncertain text, makes pending/unknown/recoverable states understandable, supports narrow screens and does not claim unsupported temporary mode or background reminders."
  - "AC5: Independent adversarial tests cover duplicates/restart/ambiguous writes, lifecycle/error/cancellation, privacy and old read-path regressions. Browser and native evidence are distinguished from real-provider quality."
  - "AC6: Record exact accepted scope/evidence/remaining limitations, update project memory, and commit/push only independently verified paths. Full assistant objective stays active."
validation_commands:
  - "Scout: read-only rg/sed/git inspections of scoped source/tests and existing native evidence; no runtime launch or test replay."
