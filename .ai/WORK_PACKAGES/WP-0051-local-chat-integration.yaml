    route: "One local exact-file writer, products clean048a7a1, no parallel writers/children. Existing synthetic integration seams and retained fixture paths reused; master handles metadata/security-source review/browser verification separately. No native execution until independent frozen review and provider admission."
    design: "Extend existing fixed authenticated host routes for submit, operation, pending, recover-create, context-preview; same exact Host/Origin/bearer/cookie guards, no arbitrary RPC/path/provider input. Browser authority remains memory-only and synchronously stripped from URL. Submit body alone128KiB accommodates escaped16KiB text; other inputs4KiB, output2MiB. Sync durable reserve remains sole dispatch authority, HTTP abort never cancels/resends native work. Expose projected bounded receipt fields without native terminal/paths/tokens. Status includes chatEnabled and host-observed active operation ID. Only poll read-only state while active, never infer active from durableUNKNOWN."
    ux: "Chinese existing interface, optional conversation title default新对话; accessible composer and status/recovery panel, narrow layout. Per-conversation page-local drafts and immutable operation UUID/payload captured before send; double clicks cannot issue new UUID. Clear only exact completed draft, preserve later edits/switches. Unknown never offers resend; explicit create recovery only searches existing result. Keep draft/ID on lost response or host shutdown and explain reopen private operator link; deliberate disconnect needs confirmation when draft/uncertainty would be discarded. Optional collapsible one-message memory preview/selection, max4 and boundedbytes, no silent full snapshot/auto-currentness claim. Refresh-safe draft persistence remains future privacy-aware requirement, clearly disclosed."
    receipt_projection: "Project original user text in reader before OTID is discarded via trusted host-only callback bound to exact Agent/conversation/OTID and stored original text; completed receipt must also match userMessageId. Pinned final textpart must equal original or exact string; never generic tag stripping. Missing receipt/OTID hides body with explicit unverified-original placeholder, not guessed content; conflicting bound receipt fails closed. Default non-chat reader unchanged. Unknown receipt evidence must not promote operation to completed."
