  - "scripts/validate_protocol.py"
  - ".ai/TEST_MATRIX.md"
  - ".ai/WORK_PACKAGES/WP-0016-status-consistency-validation.yaml"
  - ".ai/WORK_PACKAGES/WP-0017-direction-guide-skill-metadata.yaml"
