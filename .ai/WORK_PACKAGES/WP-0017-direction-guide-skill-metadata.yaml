validation_commands:
  - "ruby -e 'require \"yaml\"; text=File.read(\".agents/skills/direction-guide/SKILL.md\"); fm=text[/\\A---\\n(.*?)\\n---/m,1]; p YAML.safe_load(fm)'"
  - "python3 -c 'import importlib.util; spec=importlib.util.spec_from_file_location(\"validator\", \"scripts/validate_protocol.py\"); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); original=module.read_text; module.read_text=lambda path: \"---\\nname: direction-guide\\ndescription: Use for multi-agent Codex project orchestration: planning\\n---\\n\" if path == \".agents/skills/direction-guide/SKILL.md\" else original(path); result=module.check_direction_guide_skill_metadata(); print((\"PASS\" if not result.ok else \"FAIL\"), result.message); raise SystemExit(0 if not result.ok and \"quote metadata values\" in result.message else 1)'"
  - "python3 scripts/validate_protocol.py"
  - "git diff --check"
  - "git status --short --untracked-files=all"

implementation_shards: []

rollback_plan:
  - "If rejected, restore the prior unquoted metadata and remove the validator metadata check in a scoped revert."

human_approval_required:
