acceptance_criteria:
  - "SKILL.md frontmatter parses as valid YAML-equivalent metadata for name and description."
  - "The invalidity root cause is recorded in durable verification evidence."
  - "The protocol validator fails on malformed direction-guide metadata and passes on the fixed file."
  - "The test matrix points skill metadata validation at the validator rather than visual inspection only."
