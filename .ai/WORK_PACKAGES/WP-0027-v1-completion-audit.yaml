  - "personal-co/src/**"
  - "personal-co/tests/**"
  - "personal-co/README.md"
  - "runtime:personal-co/node_modules/@letta-ai/letta-client/**/*.d.ts"
  - "user:/Users/jie/Downloads/Personal_Co_最终产品与技术设计文档.docx"

acceptance_criteria:
  - "A complete V1 Definition-of-Done matrix covers product surfaces, single-agent identity, the fixed six-block policy, archive epistemic states, imports, learning, privacy, memory correction/forget/export, model switching, self-hosted Letta deployment, and backup/restore."
  - "The design document's T-01 through T-12 scenarios are each mapped to concrete automated, browser, live-server, or missing evidence."
  - "Every requirement is classified as PROVEN, PARTIAL, MISSING, or LIVE_BLOCKED, with a requirement citation and replayable repository evidence; mocks, TypeScript declarations, and application snapshots are not represented as live-server or database-backup proof."
  - "The report distinguishes portable same-agent application snapshots from Letta/PostgreSQL server backup and disaster recovery."
  - "The report identifies the smallest coherent next implementation package that needs no new dependency, secret, production configuration, public API, or destructive action, and separately lists items requiring human setup or approval."
  - "No application, dependency, environment, auth, permission, migration, production configuration, policy block, or repository file is changed or deleted."
  - "An independent verifier maps all criteria, confirms evidence accuracy and scope, and returns PASS before acceptance."

validation_commands:
  - "python3 -B scripts/validate_protocol.py"
  - "python3 -B scripts/protocol_gate.py audit"
  - "git diff --check"
  - "git status --short --untracked-files=all"

implementation_shards: []

