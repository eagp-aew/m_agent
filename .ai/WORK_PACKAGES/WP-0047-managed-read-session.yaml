acceptance_criteria:
  - "AC1: Extract startOwned/validateEndpoint/listenerGone into import-safe runtime-process.mjs; old probe imports/reexports remain compatible and no product module imports scripts. Preserve bounded exact native startup parsing, clean spec spawn/no shell, log ceiling, PID guard, TERM/KILL/confirmed group cleanup and listener check. Add passive settled failure notification for child error/log overflow and post-ready invalid/multiple endpoint lines; raw output stays internal to probe/helper, never managed-session errors/results. Keep reviewed-source digests covering newly imported helper."
  - "AC2: Authenticated client exposes a passive closure promise without polling/reconnect or exposing capability; existing token/header/command/endpoint policies unchanged. New managed factory composes unchanged sandbox validation/auth factory, owned process, exact endpoint authentication, bounded unique visible-tagged expected Agent preflight and reader. Trusted host config supplies exact roots/Agent ID; capture config before awaits. Return only bounded reader methods, terminal/status/close handles, never raw client/child/spec/token/logs or arbitrary RPC. No Agent creation or writes."
  - "AC3: Validate before spawning; one active session per exact stateRoot within this host module, rejected duplicates, lease retained on uncertain cleanup. Document no cross-process exclusivity claim: host controls directories; no disk lock/recovery/migration invented. Readiness means authenticated pinned info and exact expected visible personal-co-v1 Agent, not model/provider availability. Every public read refuses when not ready/closing/closed and preserves reader per-operation cancellation semantics."
  - "AC4: Startup timeout/error/bad endpoint/auth failure/missing or wrong Agent/abort, spontaneous child exit, idle socket closure and log overflow lead to terminal cleanup. Invalidate reader synchronously on terminal transition; close auth sockets/capability then stop only owned group, confirm reaping/group absence and observed listener refusal when endpoint known. close idempotent, bounded, no auto retry/restart; cleanup failures reported explicitly rather than successful closure. No raw upstream error causes. Lifetime cancellation distinct from a read's delivery cancellation."
  - "AC5: Controlled tests cover all lifecycle branches, duplicate lease, late startup/auth completion, pending reads, repeat close, post-ready child/socket/log failures, errors without usable PID, cleanup failure, and no browser credential/object leakage. Integrate real loopback ws with actual authenticated client and reader plus controlled process seam for ready/read/close. Existing confinement-helper and reader/auth tests pass; defaults never launch upstream."
  - "AC6: After independent pre-execution security PASS for frozen sources only, opt-in test uses fresh private /private/tmp roots, reused pinned install and default actual manager. Expected missing synthetic Agent must fail closed after real authenticated startup and complete owned cleanup. No Agent create, native file write, provider/turn calls or old-state access. Capture only public hashes/pins/root/PID/endpoint/cleanup observations through trusted test seam, no token. Retain fixture, final verifier corroborates evidence and absence without rerunning passed test."
  - "AC7: Targeted/related/typecheck/whitespace and independent AC/security evidence pass; memory records experimental macOS existing-Agent session only. Agent bootstrap, real canonical integration, HTTP/browser authentication, creation/sending/classification, privacy retention and provider deployment remain unfinished. No production/root/ownership guarantee extrapolation."
