approval_note: "Standing authorization covers this named local browser API/security/user-visible scope and verified commit/push. No provider spend, real-user data, native execution before frozen review or privacy confirmation bypass."
acceptance_criteria:
  - "AC1: Add explicit retainedOnly boolean opt-in to reader and managed session (default false preserves accepted host callers); browser host always forces true. Admit only conversations with personal-co-retained-v1 and without privacy:temporary or privacy:excluded; unknown/unmarked excluded, no auto-adoption. List filtering preserves raw-page accounting/overlap/opaque cursors and may return empty page with continuation. History checks admission before dispatch and again before delivery; forged ID, privacy change, foreign/hidden record fails closed. Document tags as a trusted-host convention, not deletion or complete temporary-mode enforcement."
  - "AC2: Standard-library loopback HTTP host serves existing exported Expo assets and exactly three bounded POST JSON read routes: status, conversations, messages. Bind literal127.0.0.1 on dynamic port; exact Host and Origin for APIs, no CORS/proxy/redirect/upstream URL/config forwarding. Separate random256-bit browser capability (never native capability), authorization header only, timing-safe comparison, no query/cookie/storage credentials. Limit body/response/header/sockets/concurrency/deadlines; reject malformed/extra fields, unauthorized OPTIONS/unknown routes. Disconnect aborts only its read. Errors static, no raw records/tokens/paths. CSP self scripts/connect/frame denial, no-store/referrer denial/nosniff."
  - "AC3: Static serving uses a trusted canonical owned webRoot disjoint from runtime/protected/dependency roots; only index and required allowlisted public asset types, bounded regular files, no symlink/traversal/dot/source-map/private files or SPA fallback on API paths. No new dependencies or custom dashboard. Review actual Expo export for CSP compatibility."
  - "AC4: Host owns exactly one initializeManagedReadSession lifetime, awaits ready and binds one Agent, exposes host-only launch URL plus idempotent close/terminal (not raw upstream client/spec). Browser token lives only in process/browser memory, supplied via URL fragment and synchronously stripped before requests; local-mode query marker survives refresh and shows re-open-link help if capability lost. No local/session storage or provider-key prompt. Shutdown/failure revokes capability, aborts pending reads, stops HTTP sockets/listener and closes owned managed session; uncertain cleanup never claimed success. CLI takes explicit trusted roots/webRoot and prints only deliberate operator launch link, never native token/raw logs; SIGINT/SIGTERM close owned resources. No deletion or automatic retry/recreate."
  - "AC5: Minimal App entry wrapper selects a dedicated local read surface only for explicit local launch; legacy app remains unchanged otherwise. Reuse React Native components/style language: Chinese connection/error/empty states, retained conversation list/search/manual continuation/selected chronological text history/omitted-attachment notice. Plain text rendering, no HTML. Stale selection/search/abort results cannot overwrite current view; errors do not impersonate empty success, consumed cursors never auto-replayed. Explicit disconnect clears visible data/capability locally; no fake send button or full-chat claim. Desktop and390px usable and accessible."
  - "AC6: Targeted host/client/reader/manager tests cover auth/Origin/Host/CORS, shape and byte limits, abort/shutdown, static traversal/symlinks, retained/unmarked/temporary/changed visibility, cursor continuity, client stale/abort/token handling and legacy opt-out. Related auth/bootstrap/store tests, typecheck and Expo export pass; full app test only if needed for App wrapper regression coverage. Existing native opt-ins remain off."
  - "AC7: Main actual-browser QA on compiled existing Expo app with controlled fake-session HTTP host at desktop/390px: list/history/search/empty/error/continuation/stale-selection/disconnect/missing-link/XSS-as-text and legacy offline entry. Synthetic fixtures clearly identified; no model-output quality claim. Independently review frozen source and known installation before one opt-in default actual host initialization/authenticated status/empty retained list/close test; retain public hash/identity/PID/port/cleanup evidence, no browser/native tokens or raw logs. Independent final corroboration without replay."
  - "AC8: Independent security/AC verifier and protocol preaccept pass; update memory/decision/queue and commit/push only scoped delivery. Record temporary macOS roots, port-local capability/refresh recovery, trusted retained-tags (not full privacy implementation), no sends/provider/canonical-context/classification/production completeness. Full goal stays active."
