acceptance_criteria:
  - "Connecting or reconnecting to an existing tagged Agent never silently changes its model or embedding; a configuration mismatch fails closed and directs the user to the explicit model-switch flow. Initial creation with validated handles remains supported."
  - "An explicit model-only switch can start only from a connected exact Agent context, rejects blank or unchanged targets, locks the current embedding handle, and rejects any embedding change or Agent-ID mismatch before mutation."
  - "Before the update, the adapter synchronously activates an application-instance write barrier, drains already-active mutations, completes exact target-model/current-embedding inventory validation, and captures the connected Agent's Blocks and Archive; new message, block, Archive, deletion, restore, or reconciliation mutations are rejected until the transaction finishes."
  - "The forward mutation calls `agents.update` for the existing Agent ID with the target model and disabled sleeptime, does not create/delete an Agent, and does not send a different embedding handle."
  - "After the update, deterministic invariant checks require the same Agent ID, exact target model, unchanged embedding, exact six-block policy, and unchanged canonical Blocks and Archive content before reporting success."
  - "Any error after the forward update is attempted, including an ambiguous transport rejection or post-update invariant failure, attempts a compensating update to the original model on the same Agent and verifies rollback; success is never reported after a failed gate, and writes remain blocked with an explicit diagnostic if rollback cannot be verified."
  - "The Settings UI separates draft configuration from the active connection, exposes an explicit guarded model-switch action and outcome, disables persistent controls while switching, commits the model setting only after success, and preserves/restores the prior connected state after verified rollback."
  - "Deterministic tests exercise successful same-ID switching, embedding-change rejection, write-barrier behavior, invariant failure with verified rollback, rollback failure, unchanged/no-op target rejection, and prevention of direct reconnect mutation; README explicitly states that live T-01/T-03/T-04/T-05/T-10 and PostgreSQL snapshot/recovery remain unproven."
  - "No dependency, public API, auth, secret, environment, migration, production configuration, embedding migration/reindex, database operation, Agent deletion/replacement, automatic fallback, broad refactor, or file deletion occurs."

