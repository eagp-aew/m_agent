acceptance_criteria:
  - "Before any `agents.list`, `agents.create`, or `agents.update` call in `ensureAgent`, the adapter fetches both inventories with `client.models.list()` and `client.models.embeddings.list()` and completes preflight validation."
  - "A normalized configured generation handle passes only when it exactly equals a non-empty generation-inventory `handle`; display names, model names, providers, partial strings, case variants, and automatic substitutions never count."
  - "A normalized configured embedding handle passes only when it exactly equals a non-empty embedding-inventory `handle`; missing, blank, display-name-only, or mismatched entries are rejected."
  - "If either inventory fetch fails or either exact handle is unavailable, `ensureAgent` throws before any Agent list/create/update operation, the diagnostic identifies the unavailable handle kind without exposing credentials, and no fallback handle is selected."
  - "When both handles pass, existing zero/one/duplicate tagged-Agent behavior, exact six-block validation, same-ID configuration update, Agent creation policy, and disabled sleeptime behavior remain unchanged."
  - "Deterministic tests cover successful exact matches, model mismatch, embedding mismatch, blank/missing handles, display/model-name non-matches, no substitution, and existing same-ID update behavior; adapter call order is independently inspectable."
  - "README documents the fail-closed exact-inventory contract and distinguishes deterministic SDK-contract coverage from still-pending live Letta verification."
  - "No dependency, App/settings, public API, auth, secret, environment, migration, production configuration, Agent deletion, identity replacement, automatic fallback, or file deletion change occurs."

