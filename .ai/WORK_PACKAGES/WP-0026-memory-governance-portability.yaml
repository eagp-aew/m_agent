acceptance_criteria:
  - "A sixth Memory Changes surface shows session changes with block, operation, source, epistemic state, timestamp, before/after summaries, and pending/applied/cancelled/failed status."
  - "PROFILE and GOALS_AND_DECISIONS edits are staged as pending and cannot reach Letta until an explicit Apply action; pending changes can be cancelled. CURRENT_CONTEXT and LEARNING_MODEL edits are logged when applied. PERSONA and MEMORY_POLICY remain unwritable."
  - "Core Memory shows persisted Personal Co metadata where available and offers edit/correct and clear controls; clearing a writable block requires an explicit destructive confirmation and records a change."
  - "Forget accepts a non-empty exact term, previews matching writable blocks and archive passages, requires an explicit confirmation phrase tied to that term, removes every matching core reference and archive passage, never edits policy blocks, and reports partial failures instead of claiming success."
  - "Archive results display date, category, source, and epistemic state derived from normalized tags; deleting one exact passage requires explicit confirmation and is logged."
  - "Export produces a versioned JSON snapshot containing the same agent ID, non-secret settings, all six blocks, archive records, and export timestamp; API keys and secret-like fields are excluded."
  - "Restore validates the snapshot schema and exact connected agent ID, previews block/archive changes, requires explicit confirmation, updates only writable blocks, appends only missing archive records with restore provenance, and never creates or switches agents."
  - "Settings expose language, do-not-remember terms, and temporary-session mode. Temporary messages request no memory writes and the application reconciles any detected block/archive writes back to the pre-message state, surfacing failures."
  - "Imported candidates preserve selected source and normalized type/source/epistemic tags; no imported instruction can modify policy blocks or trigger an external action."
  - "No dependency manifests, secrets, production deployment files, policy blocks, agent tag, or automatic model-fallback behavior change."
  - "Targeted governance tests, the existing test suite, TypeScript checking, Expo Web export, protocol validation, git diff checks, and browser interaction QA pass."

validation_commands:
