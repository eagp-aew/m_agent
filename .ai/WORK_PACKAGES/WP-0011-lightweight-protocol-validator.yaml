task_id: WP-0011-lightweight-protocol-validator
status: ACCEPTED
objective: "Add a lightweight no-dependency validator for the master-agent protocol scaffold."
why: "The protocol consistency checks in TEST_MATRIX should be repeatable through one command instead of manual shell searches."
scope_type: validation
priority: P1

historical_policy:
  contains_superseded_claims: true
  superseded_by:
    - DEC-0011
    - DEC-0012
    - DEC-0017
  current_policy_reference:
    - ".ai/DECISIONS.md"
    - ".agents/skills/direction-guide/references/config-policy.md"
    - ".agents/skills/direction-guide/references/routing-matrix.md"
    - ".agents/skills/direction-guide/references/tool-policy.md"
  note: "Original validator criteria checked max_depth = 1, recursive delegation disabled, and one-writer policy. Current validator policy tracks guarded parallel implementers, bounded depth-2 child-agent requests, tool policy, trust boundaries, and report-path evidence."

allowed_files:
  - "scripts/validate_protocol.py"
  - ".ai/TEST_MATRIX.md"
  - ".ai/PROJECT_STATE.md"
  - ".ai/TASK_QUEUE.yaml"
  - ".ai/DECISIONS.md"
  - ".ai/RISK_REGISTER.md"
  - ".ai/INTEGRATION_LOG.md"
  - ".ai/MASTER_LEDGER.yaml"
  - ".ai/WORK_PACKAGES/WP-0011-lightweight-protocol-validator.yaml"

forbidden_files:
  - "application source code"
  - "auth, payment, permissions, migrations, secrets, and production config"
  - "dependency manifests"
  - "deleted files"
  - "new agent roles"
  - ".codex/config.toml max_depth changes"

inputs:
  - "User-approved implementation plan"
  - "AGENTS.md"
  - ".ai/TEST_MATRIX.md"
  - ".ai/PROJECT_STATE.md"
  - ".ai/TASK_QUEUE.yaml"
  - ".ai/MASTER_LEDGER.yaml"
  - ".agents/skills/direction-guide/SKILL.md"
  - ".agents/skills/direction-guide/references/*.md"
  - ".codex/config.toml"
  - ".codex/agents/*.toml"

acceptance_criteria:
  - "Add scripts/validate_protocol.py using only Python stdlib."
  - "The validator is read-only and does not auto-fix files."
  - "The validator prints PASS/FAIL results and exits nonzero on failure."
  - "The validator checks scaffold presence, baseline agent files, max_depth = 1, recursive delegation disabled, one-writer policy, context packet requirements, verifier/fallback evidence, repeated failure escalation, and absence of routed non-baseline roles."
  - ".ai/TEST_MATRIX.md lists python3 scripts/validate_protocol.py as the preferred protocol consistency command."
  - "No dependencies, application source edits, new agent roles, deletion, recursion, or concurrency policy changes are introduced."

validation_commands:
  - "python3 scripts/validate_protocol.py"
  - "test -f .agents/skills/direction-guide/SKILL.md && test -f .codex/config.toml && test -f AGENTS.md"
  - "test -f .codex/agents/explorer.toml && test -f .codex/agents/implementer.toml && test -f .codex/agents/verifier.toml && test -f .codex/agents/fixer.toml && test -f .codex/agents/integrator.toml && test -f .codex/agents/security-reviewer.toml"
  - "Run the placeholder scan from .ai/TEST_MATRIX.md"
  - "Parse touched YAML memory files"
  - "git diff --check"
  - "git status --short"

rollback_plan:
  - "If rejected, remove the validator command references and validator script with explicit human approval for file deletion."

human_approval_required:
  required: false
  reason: "The user explicitly requested the validator; changes are limited to a read-only script, validation docs, and durable project memory with no dependencies, application source edits, deletion, or policy expansion."

assigned_agent: master

attempts:
  implement: 1
  fix: 0
  verify: 1

output_required:
  - files_changed
  - validator_command
  - tests_run
  - evidence
  - risks
